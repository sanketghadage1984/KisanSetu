<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile & Settings — KisanSetu</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="profile.css">
</head>
<body>
  <nav class="top-nav" id="topNav"></nav>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="dashboard-layout">
    <div class="page-content" style="max-width:800px;">

      <!-- Profile Header -->
      <div class="profile-header-card animate-fade" id="profileHeader">
        <div class="profile-avatar-large" id="profileAvatar">RP</div>
        <div>
          <div class="profile-name" id="profileName">Rajesh Patil</div>
          <div class="profile-email" id="profileEmail">rajesh@kisansetu.demo</div>
          <div class="profile-location" id="profileLocation">📍 Nashik, Maharashtra</div>
        </div>
      </div>

      <!-- Profile Form -->
      <div class="card animate-fade" style="margin-bottom:1.5rem;">
        <div class="card-header">
          <h4 class="card-title" data-i18n="profile.personalInfo">👤 Personal Information</h4>
        </div>
        <form id="profileForm" onsubmit="return saveProfile(event)">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="name" data-i18n="profile.fullName">Full Name</label>
              <input type="text" id="name" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label" for="email" data-i18n="profile.email">Email</label>
              <input type="email" id="email" class="form-control">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="phone" data-i18n="profile.phone">Phone</label>
              <input type="tel" id="phone" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label" for="location" data-i18n="profile.location">Location</label>
              <input type="text" id="location" class="form-control">
            </div>
          </div>
          <button type="submit" class="btn btn-primary" data-i18n="profile.save">💾 Save Changes</button>
        </form>
      </div>

      <!-- Preferences -->
      <div class="card animate-fade" style="margin-bottom:1.5rem;">
        <div class="card-header">
          <h4 class="card-title" data-i18n="profile.preferences">⚙️ Preferences</h4>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="profile.language">Language</label>
          <div class="lang-selector" style="width:fit-content;">
            <button class="lang-btn active" data-lang="en">English</button>
            <button class="lang-btn" data-lang="hi">हिंदी</button>
            <button class="lang-btn" data-lang="mr">मराठी</button>
          </div>
        </div>
        <div class="form-group" style="margin-top:1rem;">
          <label class="form-label" data-i18n="profile.notifications">Notifications</label>
          <div style="display:flex; flex-direction:column; gap:0.75rem;">
            <label class="pref-toggle">
              <input type="checkbox" checked> <span data-i18n="profile.priceAlerts">Price alerts for my crops</span>
            </label>
            <label class="pref-toggle">
              <input type="checkbox" checked> <span data-i18n="profile.newOffers">New offers from traders</span>
            </label>
            <label class="pref-toggle">
              <input type="checkbox"> <span data-i18n="profile.dailySummary">Daily market summary</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Account Actions -->
      <div class="card animate-fade">
        <div class="card-header">
          <h4 class="card-title" data-i18n="profile.account">🔒 Account</h4>
        </div>
        <div style="display:flex; flex-direction:column; gap:0.75rem;">
          <button class="btn btn-outline btn-sm" style="width:fit-content;" data-i18n="profile.resetDemo" onclick="resetDemo()">🔄 Reset Demo Data</button>
          <button class="btn btn-danger btn-sm" style="width:fit-content;" data-i18n="profile.logout" data-action="logout">🚪 Logout</button>
        </div>
      </div>

    </div>
  </main>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <script src="../../js/data.js"></script>
  <script src="../../js/translations.js"></script>
  <script src="../../js/app.js"></script>
  <script src="profile.js"></script>
</body>
</html>
