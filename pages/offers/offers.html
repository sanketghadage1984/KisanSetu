<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offers & Negotiation — KisanSetu</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="offers.css">
</head>
<body>
  <nav class="top-nav" id="topNav"></nav>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="dashboard-layout">
    <div class="page-content">
      <div class="dashboard-header">
        <div>
          <h1 class="dashboard-title" data-i18n="offers.title">💰 Offers & Negotiation</h1>
          <p class="dashboard-subtitle" data-i18n="offers.subtitle">Manage your offers — accept, reject, or counter</p>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs" id="offerTabs">
        <button class="tab active" data-i18n="offers.all" onclick="filterOffers('all', this)">All</button>
        <button class="tab" data-i18n="offers.pending" onclick="filterOffers('pending', this)">⏳ Pending</button>
        <button class="tab" data-i18n="offers.countered" onclick="filterOffers('countered', this)">💬 Countered</button>
        <button class="tab" data-i18n="offers.accepted" onclick="filterOffers('accepted', this)">✅ Accepted</button>
        <button class="tab" data-i18n="offers.rejected" onclick="filterOffers('rejected', this)">❌ Rejected</button>
      </div>

      <!-- Offers List -->
      <div id="offersList"></div>

    </div>
  </main>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <!-- Firebase Compat CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-analytics-compat.js"></script>
  <script defer src="../../js/firebase-config.js"></script>
  <script defer src="../../js/firebase-backend.js"></script>
  <!-- App Scripts -->
  <script defer src="../../js/data.js"></script>
  <script defer src="../../js/translations.js"></script>
  <script defer src="../../js/ai-engine.js"></script>
  <script defer src="../../js/blockchain.js"></script>
  <script defer src="../../js/app.js"></script>
  <script defer src="offers.js"></script>
</body>
</html>
