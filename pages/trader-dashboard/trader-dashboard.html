<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KisanSetu Trader Dashboard — Browse farmer listings, send offers, and manage procurement">
  <meta name="theme-color" content="#1565C0">
  <title>Trader Dashboard — KisanSetu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤝</text></svg>">
  <link rel="manifest" href="../../manifest.json">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="trader-dashboard.css">
</head>
<body>

  <!-- Top Nav -->
  <nav class="top-nav" id="topNav"></nav>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main Content -->
  <main class="dashboard-layout">
    <div class="page-content">

      <!-- Trader Welcome Banner (Blue theme) -->
      <div class="trader-welcome animate-fade">
        <div class="trader-role-badge">TRADER</div>
        <h2>Welcome, <span id="traderName">Trader</span>! 🤝</h2>
        <p data-i18n="traderDash.subtitle">Browse available crops from nearby farmers and make offers</p>
      </div>

      <!-- Stats Row -->
      <div class="stats-row" id="statsRow">
        <div class="stat-card animate-fade stagger-1">
          <div class="stat-icon" style="background:rgba(21,101,192,0.1);color:#1565C0;">📦</div>
          <div class="stat-info">
            <div class="stat-label" data-i18n="traderDash.listings">Available Listings</div>
            <div class="stat-value" id="listingCount">0</div>
          </div>
        </div>
        <div class="stat-card animate-fade stagger-2">
          <div class="stat-icon" style="background:rgba(255,152,0,0.1);color:#FF9800;">📤</div>
          <div class="stat-info">
            <div class="stat-label" data-i18n="traderDash.offersSent">Offers Sent</div>
            <div class="stat-value" id="offersSent">0</div>
          </div>
        </div>
        <div class="stat-card animate-fade stagger-3">
          <div class="stat-icon" style="background:rgba(76,175,80,0.1);color:#4CAF50;">🏆</div>
          <div class="stat-info">
            <div class="stat-label" data-i18n="traderDash.dealsWon">Deals Won</div>
            <div class="stat-value" id="dealsWon">0</div>
          </div>
        </div>
        <div class="stat-card animate-fade stagger-4">
          <div class="stat-icon" style="background:rgba(156,39,176,0.1);color:#9C27B0;">⭐</div>
          <div class="stat-info">
            <div class="stat-label" data-i18n="traderDash.rating">Rating</div>
            <div class="stat-value" id="traderRating">4.5</div>
          </div>
        </div>
      </div>

      <!-- Filters & Search Bar -->
      <div class="card animate-fade" style="margin-bottom:1.5rem; padding:1rem 1.25rem;">
        <div style="display:flex; flex-wrap:wrap; gap:1rem; align-items:center; justify-content:space-between;">
          <div style="display:flex; align-items:center; gap:0.5rem; flex:1; min-width:220px;">
            <input type="text" id="searchListing" class="form-control" placeholder="Search crop, farmer, location..." oninput="renderListings()" style="flex:1;">
          </div>
          <div style="display:flex; align-items:center; gap:0.5rem;">
            <select id="filterCrop" class="form-control" onchange="renderListings()" style="width:auto; min-width:130px;">
              <option value="" data-i18n="traderDash.allCrops">All Crops</option>
              <option value="Onion">🧅 Onion</option>
              <option value="Tomato">🍅 Tomato</option>
              <option value="Wheat">🌾 Wheat</option>
              <option value="Potato">🥔 Potato</option>
              <option value="Soybean">🫘 Soybean</option>
              <option value="Rice">🍚 Rice</option>
              <option value="Sugarcane">🎋 Sugarcane</option>
              <option value="Cotton">☁️ Cotton</option>
            </select>
            <select id="sortListing" class="form-control" onchange="renderListings()" style="width:auto; min-width:130px;">
              <option value="newest">⏱️ Newest First</option>
              <option value="price">💰 Lowest Price</option>
              <option value="quantity">📦 Highest Qty</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Listings Grid -->
      <div class="listings-grid" id="listingsGrid">
        <!-- Skeleton loaders while data loads -->
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>

    </div>
  </main>

  <!-- Bottom Navigation (Mobile) -->
  <nav class="bottom-nav" id="bottomNav"></nav>

  <!-- Offer Modal -->
  <div class="modal-overlay" id="offerModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>📤 Make Offer</h3>
        <button class="modal-close" onclick="closeOfferModal()">✕</button>
      </div>
      <div id="offerModalContent"></div>
    </div>
  </div>

  <!-- Firebase Compat CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-analytics-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/firebase-backend.js"></script>
  <!-- App Scripts -->
  <script src="../../js/data.js" defer></script>
  <script src="../../js/translations.js" defer></script>
  <script src="../../js/ai-engine.js" defer></script>
  <script src="../../js/app.js" defer></script>
  <script src="trader-dashboard.js" defer></script>
</body>
</html>
