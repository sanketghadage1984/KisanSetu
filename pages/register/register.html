<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your KisanSetu account — join as a farmer or trader">
  <title>Register — KisanSetu</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container animate-scale" style="max-width:480px;">
      <div style="display:flex; justify-content:flex-end; align-items:center; gap:0.5rem; margin-bottom:1rem;">
        <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle Theme" title="Toggle Light / Dark Mode">
          <span class="theme-icon">🌙</span>
        </button>
        <div class="lang-selector">
          <span class="lang-icon">🌐</span>
          <select class="lang-dropdown" aria-label="Select Language">
            <option value="en" selected>English</option>
            <option value="hi">हिंदी (Hindi)</option>
            <option value="mr">मराठी (Marathi)</option>
            <option value="bn" disabled>বাংলা (Bengali) — Soon</option>
            <option value="te" disabled>తెలుగు (Telugu) — Soon</option>
            <option value="ta" disabled>தமிழ் (Tamil) — Soon</option>
            <option value="gu" disabled>ગુજરાતી (Gujarati) — Soon</option>
            <option value="kn" disabled>ಕನ್ನಡ (Kannada) — Soon</option>
            <option value="ml" disabled>മലയാളം (Malayalam) — Soon</option>
            <option value="pa" disabled>ਪੰਜਾਬੀ (Punjabi) — Soon</option>
            <option value="or" disabled>ଓଡ଼ିଆ (Odia) — Soon</option>
            <option value="as" disabled>অসমীয়া (Assamese) — Soon</option>
            <option value="ur" disabled>اردو (Urdu) — Soon</option>
            <option value="mai" disabled>मैथिली (Maithili) — Soon</option>
            <option value="sat" disabled>ᱥᱟᱱᱛᱟᱲᱤ (Santali) — Soon</option>
            <option value="ks" disabled>کٲشُر (Kashmiri) — Soon</option>
            <option value="ne" disabled>नेपाली (Nepali) — Soon</option>
            <option value="sd" disabled>سنڌي (Sindhi) — Soon</option>
            <option value="kok" disabled>कोंकणी (Konkani) — Soon</option>
            <option value="doi" disabled>डोगरी (Dogri) — Soon</option>
            <option value="mni" disabled>মৈতৈলোন্ (Manipuri) — Soon</option>
            <option value="brx" disabled>बड़ो (Bodo) — Soon</option>
            <option value="sa" disabled>संस्कृतम् (Sanskrit) — Soon</option>
          </select>
        </div>
      </div>
      <div class="auth-header">
        <a href="../../index.html" class="logo">🌾 Kisan<span>Setu</span></a>
        <h2 data-i18n="auth.createAccount">Create Account</h2>
        <p data-i18n="cta.subtitle">Join KisanSetu and start trading smarter</p>
      </div>

      <div class="user-type-toggle" id="userTypeToggle">
        <button class="user-type-btn active" data-type="farmer" data-i18n="auth.iAmFarmer">🌾 I'm a Farmer</button>
        <button class="user-type-btn" data-type="trader" data-i18n="auth.iAmTrader">🤝 I'm a Trader</button>
      </div>

      <form id="registerForm" onsubmit="return handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="fullName"><span data-i18n="auth.fullName">Full Name</span> <span class="required">*</span></label>
          <input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="email"><span data-i18n="auth.email">Email</span> <span class="required">*</span></label>
            <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone" data-i18n="auth.phone">Phone</label>
            <input type="tel" id="phone" class="form-control" placeholder="9876543210">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="location" data-i18n="auth.location">Location</label>
          <input type="text" id="location" class="form-control" placeholder="Village/City, District, State">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password"><span data-i18n="auth.password">Password</span> <span class="required">*</span></label>
            <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword"><span data-i18n="auth.confirmPassword">Confirm Password</span> <span class="required">*</span></label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>
          </div>
        </div>

        <div style="margin-bottom:1.25rem;">
          <label style="display:flex; align-items:flex-start; gap:0.5rem; font-size:0.85rem; color:var(--text-secondary); cursor:pointer;">
            <input type="checkbox" id="terms" required style="margin-top:3px; accent-color:var(--primary);">
            <span data-i18n="auth.agreeTerms">I agree to KisanSetu's Terms of Service and Privacy Policy</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" data-i18n="auth.createAccount">Create Account</button>
      </form>

      <div class="auth-footer">
        <span data-i18n="auth.hasAccount">Already have an account?</span> <a href="../login/login.html" data-i18n="auth.signInLink">Sign In</a>
      </div>

      <!-- Divider -->
      <div style="display:flex;align-items:center;gap:0.75rem;margin:1rem 0;">
        <div style="flex:1;height:1px;background:var(--border);"></div>
        <span style="color:var(--text-muted);font-size:0.85rem;">OR</span>
        <div style="flex:1;height:1px;background:var(--border);"></div>
      </div>

      <!-- Google Sign-Up -->
      <button id="googleRegisterBtn" onclick="handleGoogleRegister()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:0.75rem;padding:0.75rem;border:2px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.borderColor='#4285F4'" onmouseout="this.style.borderColor='var(--border)'">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="22" height="22" alt="Google">
        Sign up with Google
      </button>
    </div>
  </div>

  <!-- Firebase Compat CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-analytics-compat.js"></script>
  <!-- KisanSetu Config & Backend -->
  <script defer src="../../js/firebase-config.js"></script>
  <script defer src="../../js/firebase-backend.js"></script>
  <!-- App Scripts -->
  <script defer src="../../js/data.js"></script>
  <script defer src="../../js/translations.js"></script>
  <script defer src="../../js/app.js"></script>
  <script defer src="register.js"></script>
</body>
</html>
