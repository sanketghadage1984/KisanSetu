<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby Traders — KisanSetu</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="traders.css">
</head>
<body>
  <nav class="top-nav" id="topNav"></nav>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="dashboard-layout">
    <div class="page-content">
      <div class="dashboard-header">
        <div>
          <h1 class="dashboard-title" data-i18n="traders.title">🤝 Nearby Traders</h1>
          <p class="dashboard-subtitle" data-i18n="traders.subtitle">Compare traders and find the best deal for your crop</p>
        </div>
      </div>

      <div class="demo-banner">
        <span class="icon">ℹ️</span>
        <span data-i18n="traders.demo">Demo Data — Trader information and distances are illustrative.</span>
      </div>

      <!-- Crop Selector for Comparison -->
      <div class="card crop-selector-card animate-fade" style="margin-bottom:1.5rem;">
        <h4 style="margin-bottom:0.75rem;" data-i18n="traders.selectCrop">🌾 Select Crop to Compare Traders</h4>
        <div style="display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center;">
          <select id="cropSelect" class="form-control" style="max-width:300px;" onchange="renderTraders()">
            <option value="" data-i18n="traders.all">All traders</option>
          </select>
          <select class="filter-select" id="sortTraders" onchange="renderTraders()">
            <option value="net-return" data-i18n="traders.sortNet">Sort: Best Net Return</option>
            <option value="price" data-i18n="traders.sortPrice">Sort: Highest Price</option>
            <option value="distance" data-i18n="traders.sortDist">Sort: Nearest</option>
            <option value="rating" data-i18n="traders.sortRating">Sort: Highest Rating</option>
          </select>
          <div class="search-box" style="max-width:220px;">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchTrader" class="form-control" placeholder="Search trader..." data-i18n-placeholder="traders.search" oninput="renderTraders()">
          </div>
        </div>
      </div>

      <!-- Best Trader Recommendation (for selected crop) -->
      <div id="bestTraderRecommendation" class="animate-fade"></div>

      <!-- Traders Grid -->
      <div class="traders-grid" id="tradersGrid"></div>

    </div>
  </main>

  <!-- Deal Modal -->
  <div class="modal-overlay" id="dealModal">
    <div class="modal">
      <div class="modal-header">
        <h3>💰 Make a Deal</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="dealModalContent"></div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <!-- Firebase Compat CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-analytics-compat.js"></script>
  <!-- KisanSetu Config & Backend -->
  <script defer src="../../js/firebase-config.js"></script>
  <script defer src="../../js/firebase-backend.js"></script>
  <!-- App Scripts -->
  <script defer src="../../js/crop-icons.js"></script>
  <script defer src="../../js/data.js"></script>
  <script defer src="../../js/translations.js"></script>
  <script defer src="../../js/app.js"></script>
  <script defer src="traders.js"></script>
</body>
</html>
