<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to your KisanSetu account">
  <title>Login — KisanSetu</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container animate-scale">
      <div style="display:flex; justify-content:flex-end; margin-bottom:1rem;">
        <div class="lang-selector">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="hi">हिं</button>
          <button class="lang-btn" data-lang="mr">मरा</button>
        </div>
      </div>
      <div class="auth-header">
        <a href="../../index.html" class="logo">🌾 Kisan<span>Setu</span></a>
        <h2 data-i18n="auth.welcomeBack">Welcome Back</h2>
        <p data-i18n="auth.signInSubtitle">Sign in to access your dashboard</p>
      </div>

      <div class="user-type-toggle" id="userTypeToggle">
        <button class="user-type-btn active" data-type="farmer" data-i18n="auth.farmer">🌾 Farmer</button>
        <button class="user-type-btn" data-type="trader" data-i18n="auth.trader">🤝 Trader</button>
      </div>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email" data-i18n="auth.emailPhone">Email or Phone</label>
          <input type="text" id="email" class="form-control" placeholder="Enter email or phone" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password" data-i18n="auth.password">Password</label>
          <div class="password-toggle">
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            <button type="button" class="toggle-btn" onclick="togglePassword()">👁️</button>
          </div>
        </div>

        <div class="remember-row">
          <label>
            <input type="checkbox" checked> <span data-i18n="auth.rememberMe">Remember me</span>
          </label>
          <a href="#" data-i18n="auth.forgotPassword">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" data-i18n="auth.signIn">Sign In</button>
      </form>

      <div class="auth-footer">
        <span data-i18n="auth.noAccount">Don't have an account?</span> <a href="../register/register.html" data-i18n="auth.createAccount">Create Account</a>
      </div>

      <div class="demo-credentials">
        <h5 data-i18n="auth.demoTitle">🔑 Demo Login</h5>
        <p>Email: rajesh@kisansetu.demo</p>
        <p>Password: any (demo mode)</p>
        <button class="autofill-btn" onclick="autoFillDemo()">Auto-fill Demo Credentials</button>
      </div>
    </div>
  </div>

  <script src="../../js/data.js"></script>
  <script src="../../js/translations.js"></script>
  <script src="../../js/app.js"></script>
  <script src="login.js"></script>
</body>
</html>
