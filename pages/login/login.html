<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to your KisanSetu account">
  <title>Login — KisanSetu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container animate-scale">
      <div style="display:flex; justify-content:flex-end; margin-bottom:1rem;">
        <div class="lang-selector">
          <select class="lang-dropdown" aria-label="Select Language">
            <option value="en" selected>English</option>
            <option value="hi">हिंदी — Hindi</option>
            <option value="mr">मराठी — Marathi</option>
            <option value="bn" disabled>বাংলা — Bengali (Coming Soon)</option>
            <option value="te" disabled>తెలుగు — Telugu (Coming Soon)</option>
            <option value="ta" disabled>தமிழ் — Tamil (Coming Soon)</option>
            <option value="gu" disabled>ગુજરાતી — Gujarati (Coming Soon)</option>
            <option value="kn" disabled>ಕನ್ನಡ — Kannada (Coming Soon)</option>
            <option value="ml" disabled>മലയാളം — Malayalam (Coming Soon)</option>
            <option value="pa" disabled>ਪੰਜਾਬੀ — Punjabi (Coming Soon)</option>
            <option value="or" disabled>ଓଡ଼ିଆ — Odia (Coming Soon)</option>
            <option value="as" disabled>অসমীয়া — Assamese (Coming Soon)</option>
            <option value="ur" disabled>اردو — Urdu (Coming Soon)</option>
            <option value="mai" disabled>मैथिली — Maithili (Coming Soon)</option>
            <option value="sat" disabled>ᱥᱟᱱᱛᱟᱲᱤ — Santali (Coming Soon)</option>
            <option value="ks" disabled>کٲشُر — Kashmiri (Coming Soon)</option>
            <option value="ne" disabled>नेपाली — Nepali (Coming Soon)</option>
            <option value="sd" disabled>سنڌي — Sindhi (Coming Soon)</option>
            <option value="kok" disabled>कोंकणी — Konkani (Coming Soon)</option>
            <option value="doi" disabled>डोगरी — Dogri (Coming Soon)</option>
            <option value="mni" disabled>মৈতৈলোন্ — Manipuri (Coming Soon)</option>
            <option value="brx" disabled>बड़ो — Bodo (Coming Soon)</option>
            <option value="sa" disabled>संस्कृतम् — Sanskrit (Coming Soon)</option>
          </select>
        </div>
      </div>
      <div class="auth-header">
        <a href="../../index.html" class="logo">🌾 Kisan<span>Setu</span></a>
        <h2 data-i18n="auth.welcomeBack">Welcome Back</h2>
        <p data-i18n="auth.signInSubtitle">Sign in to access your dashboard</p>
      </div>

      <div class="user-type-toggle" id="userTypeToggle">
        <button class="user-type-btn active" data-type="farmer" data-i18n="auth.farmer">🌾 Farmer</button>
        <button class="user-type-btn" data-type="trader" data-i18n="auth.trader">🤝 Trader</button>
      </div>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email" data-i18n="auth.emailPhone">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password" data-i18n="auth.password">Password</label>
          <div class="password-toggle">
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            <button type="button" class="toggle-btn" onclick="togglePassword()">👁️</button>
          </div>
        </div>

        <div class="remember-row">
          <label>
            <input type="checkbox" checked> <span data-i18n="auth.rememberMe">Remember me</span>
          </label>
          <a href="#" onclick="handleForgotPassword(); return false;" data-i18n="auth.forgotPassword">Forgot password?</a>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block btn-lg" data-i18n="auth.signIn">Sign In</button>
      </form>

      <!-- Divider -->
      <div style="display:flex;align-items:center;gap:0.75rem;margin:1.25rem 0;">
        <div style="flex:1;height:1px;background:var(--border);"></div>
        <span style="color:var(--text-muted);font-size:0.85rem;">OR</span>
        <div style="flex:1;height:1px;background:var(--border);"></div>
      </div>

      <!-- Google Sign-In -->
      <button id="googleSignInBtn" onclick="handleGoogleLogin()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:0.75rem;padding:0.75rem;border:2px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.2s;margin-bottom:0.75rem;" onmouseover="this.style.borderColor='#4285F4'" onmouseout="this.style.borderColor='var(--border)'">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="22" height="22" alt="Google">
        Continue with Google
      </button>

      <!-- Phone OTP -->
      <div id="phoneSection">
        <button onclick="togglePhoneSection()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:0.75rem;padding:0.75rem;border:2px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:0.95rem;font-weight:600;cursor:pointer;transition:all 0.2s;">
          📱 Sign in with Phone OTP
        </button>
        <div id="phoneOtpForm" style="display:none;margin-top:0.75rem;">
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="phoneNumber" class="form-control" placeholder="+91 98765 43210">
          </div>
          <div id="recaptcha-container"></div>
          <button onclick="handleSendOTP()" class="btn btn-outline btn-block" id="sendOtpBtn">Send OTP</button>
          <div id="otpVerifySection" style="display:none;margin-top:0.75rem;">
            <div class="form-group">
              <label class="form-label">Enter 6-digit OTP</label>
              <input type="number" id="otpCode" class="form-control" placeholder="123456" maxlength="6">
            </div>
            <button onclick="handleVerifyOTP()" class="btn btn-primary btn-block">Verify OTP & Login</button>
          </div>
        </div>
      </div>

      <div class="auth-footer">
        <span data-i18n="auth.noAccount">Don't have an account?</span> <a href="../register/register.html" data-i18n="auth.createAccount">Create Account</a>
      </div>
    </div>
  </div>

  <!-- Firebase Compat CDN (load before config) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-analytics-compat.js"></script>
  <!-- KisanSetu Config & Backend -->
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/firebase-backend.js"></script>
  <!-- App Scripts -->
  <script src="../../js/data.js"></script>
  <script src="../../js/translations.js"></script>
  <script src="../../js/app.js"></script>
  <script src="login.js"></script>
</body>
</html>
