<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Prices — KisanSetu</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="market.css">
</head>
<body>
  <nav class="top-nav" id="topNav"></nav>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="dashboard-layout">
    <div class="page-content">
      <div class="dashboard-header">
        <div>
          <h1 class="dashboard-title" data-i18n="market.title">📈 Market Prices</h1>
          <p class="dashboard-subtitle" data-i18n="market.subtitle">Current mandi rates from nearby markets</p>
        </div>
      </div>

      <div class="demo-banner">
        <span class="icon">ℹ️</span>
        <span data-i18n="market.demo">Demo Data — Prices shown are illustrative. Not connected to live mandi APIs.</span>
      </div>

      <!-- Search & Filter -->
      <div class="search-filter-bar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchCrop" class="form-control" placeholder="Search crop..." data-i18n-placeholder="market.search" oninput="filterMarket()">
        </div>
        <select class="filter-select" id="sortBy" onchange="filterMarket()">
          <option value="name" data-i18n="market.sortName">Sort: Name</option>
          <option value="price-high" data-i18n="market.sortHigh">Price: High → Low</option>
          <option value="price-low" data-i18n="market.sortLow">Price: Low → High</option>
          <option value="distance" data-i18n="market.sortDist">Distance: Near → Far</option>
        </select>
      </div>

      <!-- View Toggle -->
      <div class="tabs" id="viewToggle">
        <button class="tab active" data-view="cards" data-i18n="market.cards" onclick="setView('cards', this)">📦 Cards</button>
        <button class="tab" data-view="table" data-i18n="market.table" onclick="setView('table', this)">📋 Table</button>
      </div>

      <!-- Cards View -->
      <div class="market-grid" id="marketCards"></div>

      <!-- Table View -->
      <div class="table-container" id="marketTable" style="display:none;"></div>

    </div>
  </main>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <script src="../../js/crop-icons.js"></script>
  <script src="../../js/data.js"></script>
  <script src="../../js/translations.js"></script>
  <script src="../../js/app.js"></script>
  <script src="market.js"></script>
</body>
</html>
